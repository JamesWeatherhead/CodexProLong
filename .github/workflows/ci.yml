name: Receipt check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject leaked credentials
        run: python tools/secret_scan.py .
      - name: Test snapshot logic
        run: python -m unittest discover -s tests -v
      - name: Check local Markdown links
        run: python tools/check_local_links.py
      - name: Validate machine-readable frontier
        run: python -m json.tool data/frontier.json >/dev/null
